version: "2"

run:
  concurrency: 4
  timeout: 5m
  issues-exit-code: 1
  tests: true

# This is a fork that tracks upstream (5rahim/seanime). The upstream tree carries a
# large backlog of lint findings we don't own, so the standard linter set is enforced
# incrementally: CI runs golangci-lint with --new-from-merge-base=upstream/main, which
# reports findings only on lines this fork has added or changed. New fork work is held
# to the full standard set; the inherited upstream backlog is not a merge blocker.
issues:
  # Report every finding. The defaults (50 per linter, 3 with identical text) hid
  # part of the fork's own findings, so fixing what CI showed only surfaced the
  # rest on the next run.
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  default: standard
  exclusions:
    rules:
      # Drop staticcheck's "quickfix" category (QFxxxx): purely stylistic refactor
      # suggestions (tagged switches, expression lifting, embedded-field elision),
      # not correctness issues.
      - linters:
          - staticcheck
        text: "QF[0-9]+"

[project]
name = "seanime-qt"
version = "0.1.0"
description = "Qt/QML proof-of-concept frontend for the Seanime Go backend"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.6",
]

[project.scripts]
seanime-qt = "seanime_qt.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seanime_qt"]
# QML lives outside the package during the PoC; include it so wheel installs work too.
artifacts = ["qml/**"]

[tool.hatch.build.targets.wheel.force-include]
"qml" = "seanime_qt/qml"

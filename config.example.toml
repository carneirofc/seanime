# Example config.toml for an internet-facing, OIDC-protected Seanime server
# fronted by a TLS-terminating reverse proxy. Place at <datadir>/config.toml
# (with the docker-compose example that is ./data/config.toml).
#
# Keys are case-insensitive. Secrets should come from the environment, not this
# file — see clientsecret below.

[server]
# Bind address. Behind a reverse proxy, bind loopback on bare metal ("127.0.0.1")
# or 0.0.0.0 inside a container whose port is NOT published to the host. Never
# publish this port directly to the internet.
host = "0.0.0.0"
port = 43211

# The reverse proxy address(es) allowed to supply X-Forwarded-* headers, so
# client IPs and rate limits are accurate. Set this to your proxy's address; in
# Docker use the proxy container's IP or the internal network subnet.
# REQUIRED when OIDC is configured: the server refuses to start without it, since
# otherwise every client IP is whatever the caller claims. Override for local
# development with server.oidc.allowInsecure.
trustedproxies = ["127.0.0.1"]

# Canonical public URL. Required for OIDC redirects and proxy-aware secure cookies.
externalurl = "https://seanime.example.com"

# Privileged capabilities. These are the actions that reach past the media library
# and touch the host, so they are granted here and nowhere else — no source address,
# header, or authenticated session can grant them, and the API cannot grant them to
# itself. Leave unset on a server deployment and everything below stays denied.
#
#   "exec"        spawn processes: media players, torrent clients, a custom
#                 ffmpeg/ffprobe binary, "open in file explorer", plugin $os.cmd
#   "filesystem"  browse and manage the host filesystem outside the configured
#                 media roots, and repoint the library/download roots. Without it,
#                 paths are still accepted but confined to those roots.
#   "extensions"  install, update and reload third-party extensions. Extension code
#                 runs in-process, so this is equivalent to code execution.
#   "selfupdate"  download a release and replace the running binary. Pointless in a
#                 container, where the update is discarded on restart.
#   "nakama-host" serve the peer-to-peer host endpoints, which authenticate with
#                 their own shared password instead of the session.
#
# Use "all" or "none" as shorthands. A local desktop install with no proxy, no
# external URL and no OIDC defaults to "all"; anything else defaults to "none".
# capabilities = ["filesystem"]

# With OIDC active, secure mode defaults to "strict", which additionally confines
# outbound fetches to publicly routable addresses so a compromised session cannot
# reach internal services. Set "hardened" or "lax" only if you understand the
# tradeoff; privileged actions are governed by capabilities above, not by this.
# securemode = "strict"

[server.oidc]
issuerurl = "https://idp.example.com"       # discovery at <issuer>/.well-known/openid-configuration
clientid = "seanime"
# Prefer the SEANIME_OIDC_CLIENT_SECRET environment variable over storing the
# secret here. Leave this unset when using the env var.
# clientsecret = ""

# At least one of allowedsubjects / allowedusernames MUST be set — the server
# refuses to start with an empty allowlist. Prefer subjects (stable across renames).
allowedsubjects = ["248289761001"]
allowedusernames = ["your-username"]

# usernameclaim = "preferred_username"      # default; falls back to "email"
# providername = "SSO"                      # login button label
# sessionttldays = 30                       # sliding expiry
# sessionmaxdays = 90                       # absolute cap

# TLS is terminated at the reverse proxy, so the built-in server runs plain HTTP
# on the internal network. The self-signed [server.tls] block is a fallback only.
# [server.tls]
# enabled = false

# ---------------------------------------------------------------------------
# Notes on what the server does NOT hand out
#
# Stored credentials — media-player and torrent-client passwords, the debrid API
# key, the translation API key, the Nakama passwords — are withheld from every
# settings response and replaced with a placeholder. The settings UI round-trips
# the placeholder unchanged, so saving does not clear them, but they cannot be
# read back: a session proves the caller is allowlisted, not that they are
# entitled to your credentials for other systems. To change one, type the new
# value; to clear one, empty the field.
#
# Media query tokens ("?token=") are capped at 6 hours and, when minted for a
# logged-in browser, bound to that login session — signing out revokes them.
# These tokens end up in player logs and proxy access logs, so the window is
# deliberately short.
#
# For a Kubernetes deployment, see deploy/k8s/ — the pod securityContext and
# NetworkPolicy there are what actually contain what this process cannot.
# ---------------------------------------------------------------------------

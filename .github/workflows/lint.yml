name: Lint

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-lint:
    name: Go (vet + golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so golangci-lint can diff against the upstream merge-base.
          fetch-depth: 0

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/5rahim/seanime.git
          git fetch --no-tags upstream main

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          # Enforce the standard linter set on this fork's own changes only. The large
          # inherited upstream backlog is excluded by diffing against the upstream merge
          # base; new fork code is held to the full set. See .golangci.yml.
          args: --timeout=5m --new-from-merge-base=upstream/main

  web-lint:
    name: Web (typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seanime-web
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seanime-web/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Typecheck
        run: npm run typecheck

  web-biome:
    name: Web (biome)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history so Biome can diff against the base ref.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: seanime-web/package-lock.json

      - name: Install dependencies
        working-directory: seanime-web
        run: npm ci || npm install

      # Biome's --changed works at FILE granularity, unlike golangci-lint's line-level
      # --new-from-merge-base. Diffing against upstream/main would therefore re-lint every
      # file this fork has ever touched (325 errors remain in the inherited tree even with
      # the backlog rules disabled in biome.jsonc). So the diff base here is the PR's own
      # base ref: a file you modify in a PR must be clean, and untouched legacy files are
      # left alone. The formatter is intentionally not gated - see biome.jsonc.
      - name: Resolve diff base
        id: base
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "ref=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.event.before }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Biome (changed files)
        working-directory: seanime-web
        run: |
          BASE='${{ steps.base.outputs.ref }}'
          # github.event.before is all-zeroes on a branch's first push, and empty on
          # workflow_dispatch; fall back to linting nothing rather than the whole tree.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable diff base; skipping."
            exit 0
          fi
          # Biome exits 1 when no files match, so only invoke it when something changed.
          if ! git diff --name-only "$BASE"...HEAD -- seanime-web/src | grep -q .; then
            echo "No seanime-web/src changes; skipping."
            exit 0
          fi
          npx @biomejs/biome lint --changed --since="$BASE"

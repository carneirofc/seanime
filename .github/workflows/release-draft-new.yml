name: Release Draft

on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Skip docs-only pushes so every README tweak doesn't rebuild every binary.
    # The version comes from internal/constants/constants.go, not a git tag
    # (see the "Determine version" steps below).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Read-only by default: only the release job, which publishes, gets write access.
# Build jobs never see a writable token or any repository secret.
permissions:
  contents: read

jobs:

  # Gate the release on a secret scan of the source: the checked-out tree, plus every
  # commit this fork added on top of upstream (a deleted secret is still in history).
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Do not leave the job token in .git/config for later steps.
          persist-credentials: false

      - name: Fetch upstream base
        run: |
          git remote add upstream https://github.com/5rahim/seanime.git
          git fetch --no-tags upstream main

      - name: Scan source for secrets 🔐
        run: packaging/appimage/scan-source.sh upstream/main

  build-webapp: # TODO Uncomment if building web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Web
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # outputs in "seanime-web/out/"
      - name: Install dependencies and build web app
        run: |
          cd seanime-web/
          npm install
          npm run build
          cd ..
      # Upload the output to be used in the next job
      - name: Upload web folder
        uses: actions/upload-artifact@v4
        with:
          name: web
          path: seanime-web/out # output dir of build

  build-server:
    needs: build-webapp # TODO Uncomment if building web
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        # 6 binaries: 2 for Windows, 2 for Linux, 2 for macOS
        include:
          # This is the systray version of the Windows binary used for the server build
          - os: macos-latest # seanime-server-systray-windows.exe
            id: seanime-server-systray-windows
            go_flags: -trimpath -buildmode=exe -ldflags="-s -w -H=windowsgui -extldflags '-static'"

          # This is the headless (non-systray) version of the Windows binary
          - os: windows-latest # seanime-server-windows.exe
            id: seanime-server-windows
            go_flags: -trimpath -ldflags="-s -w" -tags=nosystray

          # These are the Linux binaries used for the server build
          - os: ubuntu-latest # seanime-server-linux-arm64, seanime-server-linux-amd64
            id: seanime-server-linux
            go_flags: -trimpath -ldflags="-s -w"

          # These are the macOS binaries used for the server build
          - os: macos-latest # seanime-server-darwin-arm64, seanime-server-darwin-amd64
            id: seanime-server-darwin
            go_env: CGO_ENABLED=0
            go_flags: -trimpath -ldflags="-s -w"
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history
          fetch-tags: true # Fetch all tags
          set-safe-directory: true # Add repo path as safe.directory

      - name: Fetch all tags # Fetch all tags (again? can't hurt)
        run: git fetch --force --tags

      # Go
      - name: Set up Go ⬇️
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      #      # Cache Go modules
      #      - name: Cache Go modules 💾
      #        uses: actions/cache@v4
      #        with:
      #          path: |
      #            ~/go/pkg/mod
      #            ~/.cache/go-build
      #          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
      #          restore-keys: |
      #            ${{ runner.os }}-go-

      # Download the web folders
      # TODO Uncomment if building web
      - name: Download web folder artifact
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      # Create the binary destination folder
      # ./binaries
      # |--- ...
      - name: Create binary destination folder (UNIX) 🗃️
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        run: mkdir -p binaries
      - name: Create binary destination folder (Windows) 🗃️
        if: matrix.os == 'windows-latest'
        run: mkdir -p binaries
        shell: bash


      #---

      # ONLY for Windows systray build (seanime-server-systray-windows)
      # For the Windows systray build (built on macOS runner), we need to install the necessary dependencies
      - name: Install C dependencies ⬇️ # macos windows systray build
        if: matrix.id == 'seanime-server-systray-windows'
        run: |
          brew install filosottile/musl-cross/musl-cross
          brew install llvm
          brew install mingw-w64

      # Build the Windows systray binary
      # ./binaries/seanime-server-systray-windows.exe
      - name: Build Windows Systray 📦️
        if: matrix.id == 'seanime-server-systray-windows'
        env:
          GOARCH: amd64
          GOOS: windows
          CGO_ENABLED: 1
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
        run: |
          go build -o seanime-server-systray-windows.exe ${{ matrix.go_flags }} .

      # Build the Windows non-systray binary
      # ./seanime-server-windows.exe
      - name: Build Windows Non-Systray 📦️
        if: matrix.id == 'seanime-server-windows'
        env:
          GOARCH: amd64
          GOOS: windows
          CGO_ENABLED: 0
        run: |
          go build -o seanime-server-windows.exe ${{ matrix.go_flags }} .
        shell: bash

      # Build the Linux binaries
      # Two variants, mirroring the Windows split:
      #  - nosystray (seanime-server-linux-*): headless server build
      #  - systray   (seanime-server-systray-linux-*): tray icon, used for the standalone
      #    server download. fyne.io/systray's Linux backend is pure-Go D-Bus, so CGO stays off.
      # ./seanime-server-linux-amd64
      # ./seanime-server-linux-arm64
      # ./seanime-server-systray-linux-amd64
      # ./seanime-server-systray-linux-arm64
      - name: Build Linux 📦️
        if: matrix.id == 'seanime-server-linux'
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -o seanime-server-linux-amd64 -tags=nosystray ${{ matrix.go_flags }} .
          CGO_ENABLED=0 GOARCH=arm64 go build -o seanime-server-linux-arm64 -tags=nosystray ${{ matrix.go_flags }} .
          CGO_ENABLED=0 GOARCH=amd64 go build -o seanime-server-systray-linux-amd64 ${{ matrix.go_flags }} .
          CGO_ENABLED=0 GOARCH=arm64 go build -o seanime-server-systray-linux-arm64 ${{ matrix.go_flags }} .

      # Build the macOS binaries
      # ./seanime-server-darwin-amd64
      # ./seanime-server-darwin-arm64
      - name: Build macOS 📦️
        if: matrix.id == 'seanime-server-darwin'
        run: |
          CGO_ENABLED=0 GOARCH=amd64 go build -o seanime-server-darwin-amd64 ${{ matrix.go_flags }} .
          CGO_ENABLED=0 GOARCH=arm64 go build -o seanime-server-darwin-arm64 ${{ matrix.go_flags }} .

      # Tar the binaries
      - name: Tar the binaries (UNIX) 🗃️
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        # binaries-seanime-server-darwin.tar
        # binaries-seanime-server-linux.tar
        # binaries-seanime-server-systray-windows.tar
        run: |
          tar -cf binaries-${{ matrix.id }}.tar seanime-server-*

      # Zip the binaries
      - name: Zip the binaries (Windows) 🗃️
        if: matrix.os == 'windows-latest'
        # binaries-seanime-server-windows.zip
        run: |
          7z a "binaries-${{ matrix.id }}.zip" seanime-server-*

      # Upload the binaries to be used in the next job
      - name: Upload binary folder (UNIX) 📤
        uses: actions/upload-artifact@v4
        if: matrix.os == 'macos-latest' || matrix.os == 'ubuntu-latest'
        with:
          # go-seanime-server-linux
          # go-seanime-server-darwin
          # go-seanime-server-systray-windows
          name: go-${{ matrix.id }}
          path: binaries-${{ matrix.id }}.tar

      - name: Upload binary folder (Windows) 📤
        uses: actions/upload-artifact@v4
        if: matrix.os == 'windows-latest'
        with:
          # go-seanime-server-windows
          name: go-${{ matrix.id }}
          path: binaries-${{ matrix.id }}.zip

  # Build the Windows Inno Setup installer (setup.exe).
  # Packages the systray (windowsgui, no console) server binary so the
  # Start Menu / Desktop shortcuts launch the same GUI server shipped as the
  # standalone Windows download. We pass /DAppVersion explicitly so the output
  # filename (seanime-setup-<version>.exe) and VersionInfoVersion match the
  # release tag; without it, the .iss script falls back to the version in
  # internal/constants/constants.go.
  build-installer:
    needs: build-server
    runs-on: windows-latest
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Determine the version the same way the release job does, so the installer
      # filename (seanime-setup-<version>.exe) lines up with the release assets.
      - name: Determine version 🔎
        id: version
        run: |
          # Mirror the release job's derivation exactly so the installer filename
          # (seanime-setup-<version>.exe) always matches the asset glob there.
          # Releases are triggered by merges to main (not tags), so the version
          # is read from internal/constants/constants.go.
          VERSION=$(grep -oP '^\s*Version\s*=\s*"\K[^"]+' internal/constants/constants.go | head -1)
          if [[ -z "$VERSION" ]]; then
            echo "Could not read Version from constants.go. Defaulting to 0.1.0."
            VERSION="0.1.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Installer version: $VERSION"
        shell: bash

      # Download the systray Windows server binary (built on the macOS runner).
      # Artifact go-seanime-server-systray-windows contains
      # binaries-seanime-server-systray-windows.tar -> seanime-server-systray-windows.exe
      - name: Download Windows systray server binary 📥
        uses: actions/download-artifact@v4
        with:
          name: go-seanime-server-systray-windows
          path: ./artifacts

      # The .iss script expects the binary at dist\seanime-windows-amd64.exe
      - name: Stage server binary for the installer 🗃️
        run: |
          mkdir -p dist
          tar -xf ./artifacts/binaries-seanime-server-systray-windows.tar -C ./artifacts
          mv ./artifacts/seanime-server-systray-windows.exe ./dist/seanime-windows-amd64.exe
          ls -la ./dist
        shell: bash

      # Inno Setup is not guaranteed on the runner image; install it via Chocolatey.
      - name: Install Inno Setup ⬇️
        run: choco install innosetup --no-progress -y

      - name: Compile installer 📦️
        run: |
          & "${Env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.version.outputs.version }}" "installer\seanime.iss"
        shell: pwsh

      - name: Upload installer artifact 📤
        uses: actions/upload-artifact@v4
        with:
          name: installer-windows
          path: dist/seanime-setup-${{ steps.version.outputs.version }}.exe

  # Package the systray Linux binaries as AppImages (x86_64 and arm64). Both are built
  # on one x86_64 runner: the Go binaries are static, and appimagetool only needs the
  # target architecture's runtime. build.sh refuses to emit an image that fails
  # verify.sh (exact file list + secret scan of the payload and the binary's strings).
  # See packaging/appimage/AGENTS.md.
  build-appimage:
    needs: build-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code ⬇️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build.sh uses the commit time as SOURCE_DATE_EPOCH
          persist-credentials: false

      - name: Install packaging tools ⬇️
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq squashfs-tools binutils file

      - name: Download Linux server binaries 📥
        uses: actions/download-artifact@v4
        with:
          name: go-seanime-server-linux
          path: ./artifacts

      - name: Build and verify AppImages 📦️
        run: |
          tar -xf ./artifacts/binaries-seanime-server-linux.tar -C ./artifacts
          packaging/appimage/build.sh --binary ./artifacts/seanime-server-systray-linux-amd64 --arch x86_64 --outdir ./appimage
          packaging/appimage/build.sh --binary ./artifacts/seanime-server-systray-linux-arm64 --arch aarch64 --outdir ./appimage
          ls -la ./appimage

      - name: Upload AppImages 📤
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux
          path: |
            appimage/*.AppImage
            appimage/*.AppImage.sha256
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [ secret-scan, build-server, build-installer, build-appimage ]
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows installer 📥
        uses: actions/download-artifact@v4
        with:
          name: installer-windows
          # The setup.exe is dropped directly into the repo root so it matches the
          # other release assets that are attached from there.
          path: .

      - name: Download AppImages 📥
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux
          path: .

      # Optional detached GPG signatures (seanime-<v>_Linux_<arch>.AppImage.asc). Skipped
      # when the APPIMAGE_GPG_PRIVATE_KEY secret is not configured. The key only ever
      # exists in a throwaway GNUPGHOME under RUNNER_TEMP, is passed through step-level
      # env (never a file in the workspace or a command line), and is deleted afterwards.
      # It is used after the images were built and verified, so it cannot end up in one.
      - name: Check for AppImage signing key 🔎
        id: signing
        env:
          APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$APPIMAGE_GPG_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "APPIMAGE_GPG_PRIVATE_KEY is not set; AppImages are published unsigned (sha256 only)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign AppImages 🔏
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
          APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
        run: |
          set -eu
          GNUPGHOME=$(mktemp -d "$RUNNER_TEMP/gnupg.XXXXXX")
          export GNUPGHOME
          trap 'gpgconf --kill all || true; rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s\n' "$APPIMAGE_GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          for f in seanime-*.AppImage; do
            printf '%s' "$APPIMAGE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback \
              --passphrase-fd 0 --armor --detach-sign --output "$f.asc" "$f"
            gpg --batch --verify "$f.asc" "$f"
          done

      - name: Determine version from constants.go 🔎
        run: |
          # Releases are triggered by merges to main, so the version is read from
          # internal/constants/constants.go rather than a git tag. The release
          # step below tags the resulting release v$VERSION.
          VERSION=$(grep -oP '^\s*Version\s*=\s*"\K[^"]+' internal/constants/constants.go | head -1)
          if [[ -z "$VERSION" ]]; then
          echo "Warning: Could not read Version from constants.go. Defaulting to version 0.1.0."
          VERSION="0.1.0"
          else
          echo "Version extracted from constants.go: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Print version
        run: echo "Version is ${{ env.VERSION }}"

      - name: Download server binaries 📥
        uses: actions/download-artifact@v4
        with:
          pattern: go-*
          path: ./artifacts
          # ./artifacts
          # |- binaries-seanime-server-darwin.tar (contains 2)
          # |- binaries-seanime-server-linux.tar (contains 2)
          # |- binaries-seanime-server-systray-windows.tar (contains 1)
          merge-multiple: true

      - name: Print all artifacts
        run: ls -la ./artifacts

      - name: Extract - Rename - Archive server binaries 📂
        # ./artifacts
        # |- ...
        #        \/ /binaries-seanime-server-darwin.tar
        # |- seanime-server-darwin-amd64 -> ../seanime -> ../seanime-${{ env.VERSION }}_MacOS_arm64.tar.gz
        # |- seanime-server-darwin-arm64 -> ../seanime -> ../seanime-${{ env.VERSION }}_MacOS_x86_64.tar.gz
        #        \/ /binaries-seanime-server-darwin.tar
        # |- seanime-server-linux-amd64 -> ../seanime -> ../seanime-${{ env.VERSION }}_Linux_x86_64.tar.gz
        # |- seanime-server-linux-arm64 -> ../seanime -> ../seanime-${{ env.VERSION }}_Linux_arm64.tar.gz
        #        \/ /binaries-seanime-server-systray-windows.tar
        # |- seanime-server-systray-windows.exe -> ../seanime.exe -> ../seanime-${{ env.VERSION }}_Windows_x86_64.zip
        run: |
          if [ -f ./artifacts/binaries-seanime-server-darwin.tar ]; then
            # Extract binaries
            tar -xf ./artifacts/binaries-seanime-server-darwin.tar -C ./artifacts

            # Rename & compress binaries
            mv ./artifacts/seanime-server-darwin-amd64 ./seanime
            tar czf ./seanime-${{ env.VERSION }}_MacOS_x86_64.tar.gz ./seanime
            rm -rf ./seanime


            mv ./artifacts/seanime-server-darwin-arm64 ./seanime
            tar czf ./seanime-${{ env.VERSION }}_MacOS_arm64.tar.gz ./seanime
            rm -rf ./seanime
          fi

          if [ -f ./artifacts/binaries-seanime-server-linux.tar ]; then
            # Extract binaries
            tar -xf ./artifacts/binaries-seanime-server-linux.tar -C ./artifacts

            # Rename & compress binaries.
            # The standalone Linux download ships the systray variant (like Windows),
            # so running the server directly shows a tray icon. The plain
            # seanime-server-linux-* (nosystray) binaries are the headless
            # server build.
            mv ./artifacts/seanime-server-systray-linux-amd64 ./seanime
            tar czf ./seanime-${{ env.VERSION }}_Linux_x86_64.tar.gz ./seanime
            rm -rf ./seanime


            mv ./artifacts/seanime-server-systray-linux-arm64 ./seanime
            tar czf ./seanime-${{ env.VERSION }}_Linux_arm64.tar.gz ./seanime
            rm -rf ./seanime
          fi

          if [ -f ./artifacts/binaries-seanime-server-systray-windows.tar ]; then
            # Extract binaries
            tar -xf ./artifacts/binaries-seanime-server-systray-windows.tar -C ./artifacts

            # Rename & compress binaries
            mv ./artifacts/seanime-server-systray-windows.exe ./seanime.exe
            7z a ./seanime-${{ env.VERSION }}_Windows_x86_64.zip ./seanime.exe
            rm -rf ./seanime.exe
          fi
        shell: bash

      - name: Print all
        run: ls -la .

      # Go
      - name: Set up Go ⬇️
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'

      # Build the Go script
      - name: Build Go scripts 🛠️
        run: |
          go build -o generate_updater_latest ./.github/scripts/generate_updater_latest.go
          go build -o generate_release_notes ./.github/scripts/generate_release_notes.go

      # Run the Go scripts
      - name: Generate latest.json 📦️
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: ./generate_updater_latest
      - name: Generate release notes 📦️
        env:
          APP_VERSION: ${{ env.VERSION }}
        run: ./generate_release_notes

      - name: Read release notes 🔍
        id: read_release_notes
        run: |
          BODY=$(cat whats-new.md)
          echo "RELEASE_BODY<<EOF" >> $GITHUB_ENV
          echo "$BODY" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Create release draft 🚀🚀🚀
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            # Server builds
            seanime-${{ env.VERSION }}_MacOS_x86_64.tar.gz
            seanime-${{ env.VERSION }}_MacOS_arm64.tar.gz
            seanime-${{ env.VERSION }}_Linux_x86_64.tar.gz
            seanime-${{ env.VERSION }}_Linux_arm64.tar.gz
            seanime-${{ env.VERSION }}_Windows_x86_64.zip
            # Windows installer (setup.exe)
            seanime-setup-${{ env.VERSION }}.exe
            # Linux AppImages, their checksums and (when a signing key is configured) signatures
            seanime-${{ env.VERSION }}_Linux_x86_64.AppImage
            seanime-${{ env.VERSION }}_Linux_arm64.AppImage
            seanime-${{ env.VERSION }}_Linux_*.AppImage.sha256
            seanime-${{ env.VERSION }}_Linux_*.AppImage.asc
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          draft: true
          prerelease: false
          body: |
            ## What's new?

            ${{ env.RELEASE_BODY }}

            ---
            [Open an issue](https://github.com/carneirofc/seanime/issues/new/choose)
